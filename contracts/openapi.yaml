openapi: 3.1.0
info:
  title: Adaptive HLS Experiment API
  version: 1.0.0
  license: {name: MIT, identifier: MIT}
  description: Lifecycle, telemetry, readiness, and run-scoped HLS interface.
servers:
  - url: http://127.0.0.1:8080
security: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness probe
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties: {status: {const: ok}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /readyz:
    get:
      operationId: getReadiness
      summary: Package, configuration, and persistence readiness probe
      responses:
        '200':
          description: Server is ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties: {status: {const: ready}}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/runs:
    post:
      operationId: createRun
      summary: Create an immutable run in CREATED state
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
      responses:
        '201':
          description: New run created
          content: {application/json: {schema: {$ref: './schemas/run.schema.json'}}}
        '200':
          description: Identical idempotent replay
          content: {application/json: {schema: {$ref: './schemas/run.schema.json'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/runs/{runId}:
    get:
      operationId: getRun
      summary: Read exact persisted run state
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200':
          description: Run state
          content: {application/json: {schema: {$ref: './schemas/run.schema.json'}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/runs/{runId}/start:
    post:
      operationId: startRun
      summary: Fix server monotonic t0 once and enable streaming
      parameters: [{$ref: '#/components/parameters/RunId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/StartRunRequest'}}}
      responses:
        '200':
          description: Started or identical replay
          content: {application/json: {schema: {$ref: '#/components/schemas/StartRunResponse'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/runs/{runId}/events:
    post:
      operationId: appendEvents
      summary: Idempotently append normalized player telemetry
      description: >-
        Identity is (runId, source, seq). Identical replay is a duplicate. The
        same identity with different content returns EVENT_IDENTITY_CONFLICT.
      parameters: [{$ref: '#/components/parameters/RunId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EventBatch'}}}
      responses:
        '202':
          description: Batch durably accepted
          content: {application/json: {schema: {$ref: '#/components/schemas/EventBatchResult'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/runs/{runId}/finish:
    post:
      operationId: finishRun
      summary: Finalize evidence and publish a terminal state
      parameters: [{$ref: '#/components/parameters/RunId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FinishRunRequest'}}}
      responses:
        '200':
          description: Finalized or identical replay
          content: {application/json: {schema: {$ref: './schemas/run.schema.json'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/runs/{runId}/abort:
    post:
      operationId: abortRun
      summary: Abort a CREATED or RUNNING run
      parameters: [{$ref: '#/components/parameters/RunId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties: {reason: {type: string, minLength: 1, maxLength: 500}}
      responses:
        '200':
          description: Aborted or identical replay
          content: {application/json: {schema: {$ref: './schemas/run.schema.json'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /stream/v1/{runId}/master.m3u8:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    get:
      operationId: getMasterPlaylist
      summary: Get rewritten run-scoped master playlist
      responses:
        '200': {$ref: '#/components/responses/HlsFull'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    head:
      operationId: headMasterPlaylist
      summary: Get master-playlist metadata with no body
      responses:
        '200': {$ref: '#/components/responses/HlsHead'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /stream/v1/{runId}/{assetPath}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: assetPath
        in: path
        required: true
        description: Catch-all normalized package-relative path
        schema: {type: string, minLength: 1}
    get:
      operationId: getRunAsset
      summary: Get a rewritten playlist or shaped media representation
      parameters: [{$ref: '#/components/parameters/Range'}, {$ref: '#/components/parameters/IfRange'}]
      responses:
        '200': {$ref: '#/components/responses/HlsFull'}
        '206': {$ref: '#/components/responses/HlsPartial'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '416': {$ref: '#/components/responses/RangeNotSatisfiable'}
    head:
      operationId: headRunAsset
      summary: Return selected-representation headers with no body or shaping charge
      parameters: [{$ref: '#/components/parameters/Range'}, {$ref: '#/components/parameters/IfRange'}]
      responses:
        '200': {$ref: '#/components/responses/HlsHead'}
        '206': {$ref: '#/components/responses/HlsPartialHead'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '416': {$ref: '#/components/responses/RangeNotSatisfiable'}
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RunId'}
    Range:
      name: Range
      in: header
      required: false
      schema: {type: string}
    IfRange:
      name: If-Range
      in: header
      required: false
      description: Unsupported in v1
      schema: {type: string}
  headers:
    AcceptRanges: {required: true, schema: {type: string, const: bytes}}
    CacheControl: {required: true, schema: {type: string, const: no-store}}
    ContentLength: {required: true, schema: {type: integer, minimum: 0}}
    NoSniff: {required: true, schema: {type: string, const: nosniff}}
    RunHeader: {required: true, schema: {$ref: '#/components/schemas/RunId'}}
    PhaseHeader: {required: false, schema: {type: string}}
    ContentRange: {required: true, schema: {type: string}}
  schemas:
    RunId:
      type: string
      pattern: '^r_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [requestId, experimentId, scenarioId, policyId, repetition, orderSeed, clientLabel, gitCommit, gitDirty]
      properties:
        requestId: {type: string, format: uuid}
        experimentId: {type: string}
        scenarioId: {type: string}
        policyId: {enum: [default-hlsjs, conservative-throughput-v1]}
        repetition: {type: integer, minimum: 1}
        orderSeed: {type: integer, minimum: 0, maximum: 4294967295}
        clientLabel: {type: string, minLength: 1, maxLength: 100}
        gitCommit: {type: string, pattern: '^[0-9a-f]{40}$'}
        gitDirty: {type: boolean}
    StartRunRequest:
      type: object
      additionalProperties: false
      required: [clientSendEpochMs, clientSendMonoMs]
      properties:
        clientSendEpochMs: {type: number, minimum: 0}
        clientSendMonoMs: {type: number, minimum: 0}
    StartRunResponse:
      type: object
      additionalProperties: false
      required: [runId, status, hlsUrl, serverRunStartEpochMs, serverReceiveEpochMs, serverSendEpochMs, scenarioId, scenarioSha256]
      properties:
        runId: {$ref: '#/components/schemas/RunId'}
        status: {const: RUNNING}
        hlsUrl: {type: string}
        serverRunStartEpochMs: {type: number}
        serverReceiveEpochMs: {type: number}
        serverSendEpochMs: {type: number}
        scenarioId: {type: string}
        scenarioSha256: {$ref: '#/components/schemas/Sha256'}
    EventBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 200
          items: {$ref: './schemas/telemetry-event.schema.json'}
    EventBatchResult:
      type: object
      additionalProperties: false
      required: [accepted, duplicates, highestSeqBySource]
      properties:
        accepted: {type: integer, minimum: 0}
        duplicates: {type: integer, minimum: 0}
        highestSeqBySource:
          type: object
          additionalProperties: false
          properties: {player: {type: integer, minimum: 0}}
    FinishRunRequest:
      type: object
      additionalProperties: false
      required: [reason, lastSeq, clientSummary]
      properties:
        reason: {enum: [ended, fatal_error, timeout, aborted]}
        lastSeq: {type: integer, minimum: 0}
        clientSummary: {type: object, additionalProperties: true}
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string, pattern: '^[A-Z][A-Z0-9_]+$'}
        message: {type: string}
        details: {type: object, additionalProperties: true}
  responses:
    HlsFull:
      description: Full HLS representation
      headers:
        Accept-Ranges: {$ref: '#/components/headers/AcceptRanges'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
        Content-Length: {$ref: '#/components/headers/ContentLength'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
        X-Run-Id: {$ref: '#/components/headers/RunHeader'}
        X-Scenario-Phase: {$ref: '#/components/headers/PhaseHeader'}
      content:
        application/vnd.apple.mpegurl: {schema: {type: string}}
        video/mp2t: {schema: {type: string, format: binary}}
    HlsPartial:
      description: Single selected byte range
      headers:
        Accept-Ranges: {$ref: '#/components/headers/AcceptRanges'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
        Content-Length: {$ref: '#/components/headers/ContentLength'}
        Content-Range: {$ref: '#/components/headers/ContentRange'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
        X-Run-Id: {$ref: '#/components/headers/RunHeader'}
        X-Scenario-Phase: {$ref: '#/components/headers/PhaseHeader'}
      content:
        application/vnd.apple.mpegurl: {schema: {type: string}}
        video/mp2t: {schema: {type: string, format: binary}}
    HlsHead:
      description: Full representation metadata with no body
      headers:
        Accept-Ranges: {$ref: '#/components/headers/AcceptRanges'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
        Content-Length: {$ref: '#/components/headers/ContentLength'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
        X-Run-Id: {$ref: '#/components/headers/RunHeader'}
    HlsPartialHead:
      description: Byte-range metadata with no body
      headers:
        Accept-Ranges: {$ref: '#/components/headers/AcceptRanges'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
        Content-Length: {$ref: '#/components/headers/ContentLength'}
        Content-Range: {$ref: '#/components/headers/ContentRange'}
        X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
        X-Run-Id: {$ref: '#/components/headers/RunHeader'}
    BadRequest: {description: Malformed request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: "Lifecycle, idempotency, or EVENT_IDENTITY_CONFLICT", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    PayloadTooLarge: {description: Body exceeds 1 MiB, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ServiceUnavailable: {description: Not ready, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    RangeNotSatisfiable:
      description: Valid range is unsatisfiable
      headers: {Content-Range: {$ref: '#/components/headers/ContentRange'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
